openapi: 3.0.3
info:
  title: RolêOut API
  version: 1.0.0
  description: API Java de contas, descoberta, roteiros, aprovação, horários, notificações, perfis e publicações. Requer migrações V001 a V029. Consulte trabalho-api-t2.md para o CRUD e publicacoes-roteiros.md para o compartilhamento.
servers:
  - url: http://127.0.0.1:8082/RoleOut/api/v1
paths:
  /comunidade/feed:
    parameters: []
    get:
      summary: Passeios públicos; filtro seguindo=true e cursor apos opcional
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
      parameters:
        - name: seguindo
          in: query
          schema:
            type: boolean
        - name: apos
          in: query
          schema:
            type: integer
            format: int64
  /comunidade/seguir/{perfilId}:
    parameters:
      - name: perfilId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Consultar, ativar ou remover acompanhamento privado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
    put:
      summary: Consultar, ativar ou remover acompanhamento privado
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
    delete:
      summary: Consultar, ativar ou remover acompanhamento privado
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
  /comunidade/copiar/{publicacaoId}:
    parameters:
      - name: publicacaoId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Criar nova cópia privada revalidada e com créditos
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - planejamento
              properties:
                planejamento:
                  type: object
                  required:
                    - cidade
                    - data
                    - partida
                    - duracaoMinutos
                    - pessoas
                    - orcamentoCentavos
                    - modoOrcamento
                    - paradas
                  properties:
                    nome:
                      type: string
                      maxLength: 200
                    cidade:
                      type: string
                      minLength: 1
                      maxLength: 150
                    data:
                      type: string
                      format: date
                    partida:
                      type: string
                      example: 14:00
                    duracaoMinutos:
                      type: integer
                      minimum: 60
                      maximum: 720
                    pessoas:
                      type: integer
                      minimum: 1
                      maximum: 50
                    orcamentoCentavos:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 999999999
                    modoOrcamento:
                      type: string
                      enum:
                        - person
                        - group
                    paradas:
                      type: array
                      minItems: 1
                      maxItems: 48
                      items:
                        type: object
                        required:
                          - roleId
                          - minutos
                        properties:
                          roleId:
                            type: integer
                            minimum: 1
                          minutos:
                            type: integer
                            minimum: 15
                            maximum: 720
                            multipleOf: 15
                          horario:
                            type: string
                            nullable: true
                            example: 14:00
  /comunidade/creditos/{roteiroId}:
    parameters:
      - name: roteiroId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Créditos de roteiro, somente proprietário
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
  /comunidade/origem/{publicacaoId}:
    parameters:
      - name: publicacaoId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Créditos da origem de publicação visível
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
  /comunidade/textos/{tipo}/{alvo}:
    parameters:
      - name: tipo
        in: path
        required: true
        schema:
          type: string
          enum:
            - COMENTARIO
            - AVALIACAO
      - name: alvo
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Comentários ou avaliações; itens, proximo, total, media
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
      parameters:
        - name: apos
          in: query
          schema:
            type: integer
            format: int64
    put:
      summary: Criar ou atualizar próprio texto; avaliação exige visita concluída
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - texto
                - nota
              properties:
                texto: &a1
                  type: string
                  minLength: 1
                  maxLength: 1000
                nota:
                  type: integer
                  minimum: 1
                  maximum: 5
                  nullable: true
    delete:
      summary: Excluir próprio texto visível
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
  /comunidade/denuncias:
    parameters: []
    post:
      summary: Denunciar conteúdo; repetição idempotente
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tipo
                - alvo
                - motivo
              properties:
                tipo:
                  type: string
                  enum:
                    - PUBLICACAO
                    - TEXTO
                alvo:
                  type: string
                motivo: *a1
    get:
      summary: Administrador lista até 20 denúncias pendentes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
      parameters:
        - name: apos
          in: query
          schema:
            type: integer
            format: int64
  /comunidade/denuncias/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Administrador decide manter ou ocultar
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Consulte docs/comunidade.md para campos e exemplos
        "400":
          description: Formato inválido
        "401":
          description: Sessão obrigatória
        "403":
          description: Sem permissão
        "404":
          description: Indisponível
        "409":
          description: Conflito de estado, preço ou horário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ocultar
                - justificativa
              properties:
                ocultar:
                  type: boolean
                justificativa: *a1
  /minhas-publicacoes/{roteiroId}:
    parameters:
      - { name: roteiroId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      summary: Ler publicação própria ou editor privado inicial do roteiro
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'id, titulo, relato, cidade, paradas, fotos, publico, versao. Inicial usa id null e versao 0.' }
        '401': { description: Sessão obrigatória }
        '404': { description: Roteiro inexistente ou de outra conta }
    put:
      summary: Salvar rascunho ou publicar com versão; fotos substituem as anteriores
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, titulo, relato, publico, versao, fotos]
              properties:
                id: { type: string, format: uuid, nullable: true }
                titulo: { type: string, minLength: 1, maxLength: 120 }
                relato: { type: string, maxLength: 3000 }
                publico: { type: boolean }
                versao: { type: integer, minimum: 0 }
                fotos:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required: [base64, legenda]
                    properties:
                      base64: { type: string, format: byte, maxLength: 2796204, description: JPEG ou PNG de até 2 MiB; servidor reencoda sem metadados }
                      legenda: { type: string, maxLength: 200 }
      responses:
        '200': { description: Publicação salva com versão incrementada }
        '400': { description: Dados ou foto inválidos }
        '401': { description: Sessão obrigatória }
        '404': { description: Roteiro inexistente ou de outra conta }
        '409': { description: Conflito de versão/UUID, perfil privado ou limite de publicações }
        '413': { description: Corpo maior que 8500000 bytes/caracteres }
        '415': { description: Envie JSON }
        '429': { description: Processamento de fotos ocupado }
    delete:
      summary: Excluir publicação e fotos, preservando roteiro privado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersaoPublicacao' }
      responses:
        '204': { description: Excluída }
        '401': { description: Sessão obrigatória }
        '404': { description: Indisponível ou de outra conta }
        '409': { description: Versão/UUID desatualizados }
  /minhas-publicacoes/{roteiroId}/ocultar:
    parameters:
      - { name: roteiroId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      summary: Ocultar somente a versão salva, sem alterar texto/fotos
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersaoPublicacao' }
      responses:
        '200': { description: Publicação privada com versão incrementada }
        '401': { description: Sessão obrigatória }
        '404': { description: Indisponível ou de outra conta }
        '409': { description: Versão/UUID desatualizados }
  /publicacoes:
    get:
      summary: Passeios compartilhados em um perfil público
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: autor, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: apos, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'itens (até 20 resumos sem imagens) e proximo (UUID ou null)' }
        '400': { description: UUID inválido }
        '401': { description: Sessão obrigatória }
        '404': { description: Perfil privado ou inexistente }
  /publicacoes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Ler publicação visível com autor, paradas, relato e fotos JPEG sanitizadas
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'id, autor, titulo, relato, cidade, paradas e fotos; sem dados privados do planejamento' }
        '401': { description: Sessão obrigatória }
        '404': { description: Publicação/perfil privado ou inexistente }
  /auth/cadastro:
    post:
      summary: Criar uma conta (não inicia sessão)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome: { type: string }
                email: { type: string, format: email }
                senha: { type: string, format: password }
      responses:
        '201': { description: Conta criada, sem senha no retorno }
        '400': { description: Campos inválidos }
        '409': { description: E-mail já cadastrado }
        '429': { description: Limite de tentativas }
  /auth/login:
    post:
      summary: Autenticar e obter token de sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string, format: password }
      responses:
        '200': { description: 'Objeto com token, expiraEm e conta' }
        '400': { description: Campos inválidos }
        '401': { description: Credenciais inválidas }
        '429': { description: Limite de tentativas ou sessões }
  /roteiros:
    get:
      summary: Listar roteiros privados da conta autenticada
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deslocamento
          in: query
          schema: { type: integer, minimum: 0, maximum: 100, default: 0 }
      responses:
        '200': { description: 'Objeto com itens e limite (20)' }
        '400': { description: Deslocamento inválido }
        '401': { description: Sessão obrigatória }
    post:
      summary: Criar roteiro e suas paradas em uma transação
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidade, data, partida, duracaoMinutos, pessoas, orcamentoCentavos, modoOrcamento, paradas]
              properties:
                nome: { type: string, maxLength: 200 }
                cidade: { type: string, minLength: 1, maxLength: 150 }
                data: { type: string, format: date }
                partida: { type: string, example: '14:00' }
                duracaoMinutos: { type: integer, minimum: 60, maximum: 720 }
                pessoas: { type: integer, minimum: 1, maximum: 50 }
                orcamentoCentavos: { type: integer, format: int64, minimum: 0, maximum: 999999999 }
                modoOrcamento: { type: string, enum: [person, group] }
                paradas:
                  type: array
                  minItems: 1
                  maxItems: 48
                  items:
                    type: object
                    required: [roleId, minutos]
                    properties:
                      roleId: { type: integer, minimum: 1 }
                      minutos: { type: integer, minimum: 15, maximum: 720, multipleOf: 15 }
                      horario: { type: string, nullable: true, example: '14:00' }
      responses:
        '201': { description: 'Roteiro criado; objeto com roteiro (incluindo id) e paradas' }
        '400': { description: Dados ou horários incompatíveis }
        '401': { description: Sessão obrigatória }
        '409': { description: 'Parada indisponível, orçamento insuficiente ou limite de roteiros' }
  /roteiros/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Consultar roteiro próprio e suas paradas
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Objeto com roteiro e paradas }
        '401': { description: Sessão obrigatória }
        '404': { description: Roteiro inexistente ou de outra conta }
    delete:
      summary: Excluir roteiro próprio e suas paradas; preserva catálogo público
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Excluído, sem corpo }
        '401': { description: Sessão obrigatória }
        '404': { description: Roteiro inexistente ou de outra conta }
  /roteiros/{id}/nome:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      summary: Substituir o nome do roteiro próprio, preservando o planejamento
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200': { description: Objeto com roteiro e paradas atualizados }
        '400': { description: Nome inválido }
        '401': { description: Sessão obrigatória }
        '404': { description: Roteiro inexistente ou de outra conta }
  /roteiros/{id}/paradas/{roleId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: roleId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      summary: Alterar conclusão da parada de um roteiro próprio
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concluida]
              properties:
                concluida: { type: boolean }
      responses:
        '200': { description: Objeto com roteiro e paradas atualizados }
        '400': { description: Dados inválidos }
        '401': { description: Sessão obrigatória }
        '404': { description: Roteiro ou parada inexistente ou sem acesso }
  /perfil-social:
    get:
      summary: Perfil social privado da conta autenticada, vazio e privado antes de criar
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'id (nullable), nome, apresentacao, publico e versao. Não copia dados da conta.' }
        '401': { description: Sessão obrigatória }
    put:
      summary: Salvar ou ocultar o próprio perfil social com controle de versão
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nome, apresentacao, publico, versao]
              properties:
                nome: { type: string, minLength: 1, maxLength: 80 }
                apresentacao: { type: string, maxLength: 500 }
                publico: { type: boolean }
                versao: { type: integer, minimum: 0, description: '0 na primeira gravação; usar a versão retornada nas seguintes.' }
      responses:
        '200': { description: Perfil salvo com versão incrementada }
        '400': { description: Campos inválidos ou desconhecidos }
        '401': { description: Sessão obrigatória }
        '409': { description: Versão desatualizada; recarregar antes de salvar }
  /perfis:
    get:
      summary: Perfis voluntariamente públicos para outras contas autenticadas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: apos
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 'itens com apenas id público UUID, nome e apresentacao; até 20 por página. proximo é cursor UUID ou null.' }
        '400': { description: Cursor inválido }
        '401': { description: Sessão obrigatória }
  /perfis/{id}:
    get:
      summary: Ler um perfil público sem expor e-mail, roteiros, preferências ou localização
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Somente id público UUID, nome e apresentacao }
        '401': { description: Sessão obrigatória }
        '404': { description: Mesmo retorno para privado ou inexistente }
  /sugestoes-automaticas:
    get:
      summary: Consulta controles de sugestões da conta autenticada
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Configuração inicial preparada (ativo/viagens true), sem executar até definir cidade e autorizar o aparelho. Preferências existentes preservadas. Ver docs/sugestoes-automaticas.md.
    put:
      summary: Ativa ou desativa sugestões no Explorar e define frequência e cidade de referência
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativo, viagens, intervaloHoras]
              properties:
                ativo: { type: boolean }
                viagens: { type: boolean }
                intervaloHoras: { type: integer, enum: [0, 24, 72, 168], description: "0 = até 3 em 24h; extras exigem 3 grupos, mínimo 1h entre sugestões. Demais valores são intervalos em horas." }
                cidadeBase: { type: string, nullable: true, maxLength: 100 }
      responses:
        '200': { description: Configuração salva; cidade obrigatória quando ativo. }
    post:
      summary: Avalia uma sugestão aprovada próxima e consome o limite somente se houver resultado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, cidade, fuso]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                cidade: { type: string, maxLength: 100 }
                fuso: { type: string, example: America/Sao_Paulo }
      responses:
        '200': { description: Objeto sugestao ou null. Avaliação por conta, sem armazenar coordenadas. }

  /roles/proximos:
    get:
      operationId: buscarRolesProximos
      summary: Até 100 rolês próximos vinculados a locais e organizações aprovados
      description: Sem coordenadas inventadas para registros legados. Distância geográfica em linha reta; não é distância de percurso.
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: raioKm
          in: query
          schema: { type: number, minimum: 0.1, maximum: 20, default: 5 }
      responses:
        '200':
          description: Pontos ordenados por distância, limite 100
          content:
            application/json:
              schema:
                type: object
                properties:
                  limite: { type: integer, example: 100 }
                  itens:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        nome: { type: string }
                        categoria: { type: string, nullable: true }
                        latitude: { type: number }
                        longitude: { type: number }
                        distanciaKm: { type: number }
                        cidade: { type: string, nullable: true }
                        data: { type: string, format: date, nullable: true }
                        dataFim: { type: string, format: date, nullable: true }
                        horario: { type: string, nullable: true, example: '09:00' }
                        horarioFim: { type: string, nullable: true, example: '18:00' }
                        caracteristicas:
                          $ref: "#/components/schemas/RoleCharacteristics"
                        funcionamento:
                          type: array
                          nullable: true
                          description: Regras publicadas; exceção por data prevalece sobre o dia semanal. Ausência de regra não confirma abertura.
                          items:
                            type: object
                            properties:
                              dia: { type: string, example: '2' }
                              intervalos:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    inicio: { type: string, example: '09:00' }
                                    fim: { type: string, example: '18:00' }
        '400':
          $ref: '#/components/responses/ParametroInvalido'
        '503':
          $ref: '#/components/responses/BancoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /roles:
    get:
      operationId: listarRoles
      summary: Consultar rolês públicos com paginação
      parameters:
        - $ref: '#/components/parameters/CategoriaOpcional'
        - $ref: '#/components/parameters/CidadeOpcional'
        - $ref: '#/components/parameters/OrcamentoOpcional'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Deslocamento'
      responses:
        '200':
          $ref: '#/components/responses/Pagina'
        '400':
          $ref: '#/components/responses/ParametroInvalido'
        '503':
          $ref: '#/components/responses/BancoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /roles/{id}:
    get:
      operationId: buscarRole
      summary: Consultar detalhe de rolê público
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Detalhe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/ParametroInvalido'
        '404':
          description: Rolê ausente ou não publicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          $ref: '#/components/responses/BancoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /sugestoes:
    get:
      operationId: buscarSugestoes
      summary: Consultar sugestões ordenadas por valor e ID
      parameters:
        - name: categoria
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: cidade
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 150
        - name: valorMaximo
          in: query
          required: true
          schema:
            type: number
            minimum: 0
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Deslocamento'
      responses:
        '200':
          $ref: '#/components/responses/Pagina'
        '400':
          $ref: '#/components/responses/ParametroInvalido'
        '503':
          $ref: '#/components/responses/BancoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CategoriaOpcional:
      name: categoria
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CidadeOpcional:
      name: cidade
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 150
    OrcamentoOpcional:
      name: valorMaximo
      in: query
      schema:
        type: number
        minimum: 0
    Limite:
      name: limite
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Deslocamento:
      name: deslocamento
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
  responses:
    Pagina:
      description: Lista paginada, sem contagem total
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pagina'
    ParametroInvalido:
      description: Parâmetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    BancoIndisponivel:
      description: Falha de acesso ao banco
      headers:
        Retry-After:
          schema:
            type: string
            example: '5'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroInterno:
      description: Falha inesperada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    VersaoPublicacao:
      type: object
      additionalProperties: false
      required: [id, versao]
      properties:
        id: { type: string, format: uuid }
        versao: { type: integer, minimum: 1 }
    RoleCharacteristics:
      type: object
      nullable: true
      description: Características declaradas pelo responsável e publicadas após aprovação. Listas vazias significam não informado; opções iguais às preferências.
      properties:
        musica:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            type: string
            enum: [Pop, Rock, Sertanejo, MPB, Samba e pagode, Eletrônica, Forró, Hip-hop]
        comida:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            type: string
            enum: [Brasileira, Italiana, Japonesa, Hambúrguer, Vegetariana, Cafés e doces]
        ambientes:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            type: string
            enum: [Tranquilo, Animado, Ao ar livre, Familiar, Romântico, Cultural]
    Role:
      type: object
      required: [id, nome, descricao, local, cidade, data, categoria, valor]
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        local:
          type: string
          nullable: true
        cidade:
          type: string
        data:
          type: string
          format: date
          nullable: true
        horario:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Início informado no cadastro, no horário local do evento.
        dataFim:
          type: string
          format: date
          nullable: true
          description: Data de término de um intervalo contínuo. Exige data, horario e horarioFim; ausente preserva o término no mesmo dia.
        caracteristicas:
          $ref: "#/components/schemas/RoleCharacteristics"
        funcionamento:
          type: array
          nullable: true
          maxItems: 67
          description: Horários desta atividade no local, publicados após aprovação. Dias 1–7 (segunda–domingo) ou exceção YYYY-MM-DD. A exceção substitui a semana; dia ausente significa não informado, intervalos vazios significam fechado. Até 60 exceções. Horários civis locais, sem garantia de vagas.
          items:
            type: object
            required: [dia, intervalos]
            properties:
              dia:
                type: string
              intervalos:
                type: array
                maxItems: 4
                items:
                  type: object
                  required: [inicio, fim]
                  properties:
                    inicio:
                      type: string
                      example: '09:00'
                    fim:
                      type: string
                      example: '18:00'
                      description: Posterior ao início; aceita 24:00. Intervalos não podem se sobrepor.
        horarioFim:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Término posterior ao início, na dataFim quando informada ou na data inicial. Nulo significa não informado; não comprova disponibilidade.
        cancelado:
          type: boolean
          description: Cancelados são omitidos da busca; o detalhe por ID mantém a situação consultável.
        motivoCancelamento:
          type: string
          nullable: true
          description: Motivo público do cancelamento aprovado.
        categoria:
          type: string
          nullable: true
        valor:
          type: number
          minimum: 0
    Pagina:
      type: object
      required: [itens, limite, deslocamento]
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        limite:
          type: integer
        deslocamento:
          type: integer
    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
        mensagem:
          type: string
