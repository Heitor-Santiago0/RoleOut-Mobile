# Optional local inbox. No email leaves this environment.
services:
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:8025:8025"
  tomcat:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: roleout@example.test
      MAIL_LOCAL_TEST: "true"
